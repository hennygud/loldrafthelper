name: build-exe
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller pywebview
      - if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: sed -i "s/^VERSION = .*/VERSION = \"${GITHUB_REF_NAME#v}\"/" lol_bridge.py
      - name: build exe (stats.json, если лежит в репозитории, упаковывается внутрь)
        shell: bash
        run: |
          EXTRA=""
          if [ -f stats.json ]; then EXTRA='--add-data stats.json;.'; fi
          pyinstaller --onefile --windowed --name "MLK Helper" --icon assets/mlkdrafthelper.ico --add-data "assets;assets" --add-data "lol_draft_helper.html;." $EXTRA --collect-all webview --collect-all clr_loader --collect-all pythonnet --hidden-import clr lol_bridge.py
      - name: selftest (не выпускаем сломанный exe)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist/MLK Helper.exe" -ArgumentList '--selftest', "$PWD/selftest.txt" -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw 'selftest timeout' }
          Get-Content selftest.txt
          if ((Get-Content selftest.txt -TotalCount 1) -ne 'ok') { throw 'selftest failed' }
      - shell: pwsh
        run: (Get-FileHash "dist/MLK Helper.exe" -Algorithm SHA256).Hash.ToLower() | Out-File -Encoding ascii -NoNewline "dist/MLK Helper.exe.sha256"
      - name: Package portable Windows launcher
        shell: pwsh
        run: ./package_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: MLK Helper
          path: |
            dist/MLK Helper.exe*
            dist/MLK-Helper-Windows.zip
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/MLK Helper.exe
            dist/MLK Helper.exe.sha256
            dist/MLK-Helper-Windows.zip
