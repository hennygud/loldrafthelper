name: build-exe
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: sed -i "s/^VERSION = .*/VERSION = \"${GITHUB_REF_NAME#v}\"/" lol_bridge.py
      - name: Build Windows app and portable archive
        shell: cmd
        run: call build_exe.bat python
      - name: selftest (не выпускаем сломанный exe)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist/MLK.gg.exe" -ArgumentList '--selftest', "$PWD/selftest.txt" -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw 'selftest timeout' }
          Get-Content selftest.txt
          if ((Get-Content selftest.txt -TotalCount 1) -ne 'ok') { throw 'selftest failed' }
      - shell: pwsh
        run: (Get-FileHash "dist/MLK.gg.exe" -Algorithm SHA256).Hash.ToLower() | Out-File -Encoding ascii -NoNewline "dist/MLK.gg.exe.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: MLK.gg
          path: |
            dist/MLK.gg.exe*
            dist/MLK.gg-Windows.zip
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/MLK.gg.exe
            dist/MLK.gg.exe.sha256
            dist/MLK.gg-Windows.zip
